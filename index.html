<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/app.css">
<script>
/* Detecta la tienda por el dominio y aplica marca + config. */
(function(){
  var VARGAS = {dom:"vargasdiesel.cl", tienda:"Vargas Diesel", marca:"title",
      accent:"#FF7A1A", accent2:"#c85a00", fontH:'"Fjalla One",system-ui,sans-serif', gfont:"family=Fjalla+One"};
  var CPR = {dom:"comercialcpr.cl", tienda:"Comercial CPR", marca:"vendor",
      accent:"#004F8F", accent2:"#D32F2F", fontH:'"Montserrat",system-ui,sans-serif', gfont:"family=Montserrat:wght@700;800"};
  var BYC = {dom:"repuestosbyc.cl", tienda:"Repuestos BYC", marca:"title",
      accent:"#C00000", accent2:"#7a0000", fontH:'"Oswald",system-ui,sans-serif', gfont:"family=Oswald:wght@600;700"};
  var HOSTS = {
    "stock.vargasdiesel.cl": VARGAS,
    "stock.comercialcpr.cl": CPR,
    "stock.repuestosbyc.cl": BYC,
    "stock-vargas.vercel.app": VARGAS,
    "stock-cpr.vercel.app": CPR,
    "stock-byc.vercel.app": BYC
  };
  var h = (location.hostname||"").toLowerCase();
  var c = HOSTS[h] || HOSTS["stock.vargasdiesel.cl"]; // fallback para previsualización
  var s = document.documentElement.style;
  s.setProperty("--accent", c.accent);
  s.setProperty("--accent2", c.accent2);
  s.setProperty("--font", '"Assistant",system-ui,sans-serif');
  s.setProperty("--fontH", c.fontH);
  var l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?" + c.gfont + "&family=Assistant:wght@400;600;700&display=swap";
  document.head.appendChild(l);
  document.title = "Stock " + c.tienda;
  window.STORE = {dom:c.dom, tienda:c.tienda, marca:c.marca};
})();
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="tienda">&nbsp;</h1>
    <div class="sub">Buscador de stock y precios · en vivo</div>
    <div id="upd"></div>
  </header>
  <div id="kpis"></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Buscar por código, nombre o marca…" autocomplete="off">
    <select id="f-tipo"></select>
    <select id="f-marca"></select>
    <select id="f-stock"><option value="">Todo stock</option><option value="ok">En stock</option><option value="no">Sin stock</option></select>
    <select id="f-code"><option value="">Con/sin código</option><option value="with">Con código</option><option value="without">Sin código</option></select>
    <div class="views"><button id="v-card" class="on" title="Tarjetas">▦</button><button id="v-table" title="Tabla">≣</button></div>
  </div>
  <div class="statusbar"><span id="status">Cargando…</span><button id="reload" style="display:none" onclick="location.reload()">↻ Reintentar</button></div>
  <div id="results"></div>
  <button id="more" style="display:none">Mostrar más</button>
  <footer>Datos en vivo · Precios netos (IVA aparte)</footer>
</div>
<script src="/app.js"></script>
</body>
</html>
